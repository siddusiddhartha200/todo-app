
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - Todo App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: Arial, sans-serif;
      background: #f7f7fc;
      color: #202033;
    }

    .container {
      max-width: 820px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #655cf6, #8745ef);
      border-radius: 27px;
      color: white;
      font-size: 55px;
      box-shadow: 0 10px 25px #655cf626;
    }

    h1 {
      margin: 0;
      font-size: 45px;
    }

    header p {
      color: #858596;
      font-size: 21px;
    }

    .todo-box {
      background: white;
      padding: 32px;
      border-radius: 30px;
      border: 1px solid #ededf3;
      box-shadow: 0 15px 45px #22224408;
    }

    form {
      display: flex;
      gap: 14px;
    }

    #taskInput {
      flex: 1;
      min-width: 0;
      padding: 18px;
      font-size: 17px;
      border: 1px solid #dedee8;
      border-radius: 17px;
      outline: none;
    }

    #taskInput:focus {
      border-color: #655cf6;
    }

    button {
      cursor: pointer;
      font-size: 16px;
    }

    .add-btn {
      padding: 0 25px;
      border: none;
      border-radius: 17px;
      color: white;
      background: #655cf6;
    }

    .add-btn:hover {
      background: #5148e7;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 0;
      color: #858596;
    }

    .filters {
      display: flex;
      gap: 12px;
      padding-bottom: 24px;
      border-bottom: 1px solid #eeeeF4;
    }

    .filter-btn {
      border: none;
      padding: 12px 19px;
      border-radius: 13px;
      background: transparent;
      color: #55556a;
    }

    .filter-btn.active {
      background: #f0edff;
      color: #5148a8;
    }

    #taskList {
      padding: 24px 0;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 20px;
      margin-bottom: 14px;
      border: 1px solid #e9e9f0;
      border-radius: 21px;
      background: white;
    }

    .task input {
      width: 23px;
      height: 23px;
      accent-color: #655cf6;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 19px;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #9999a5;
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: #9292a0;
      font-size: 27px;
    }

    .delete-btn:hover {
      color: #e14e68;
    }

    .empty {
      padding: 25px 0;
      text-align: center;
      color: #858596;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 22px;
      border-top: 1px solid #eeeeF4;
      color: #858596;
    }

    .clear-btn {
      border: none;
      background: transparent;
      color: #6960a7;
    }

    .tagline {
      margin-top: 40px;
      text-align: center;
      color: #858596;
      font-size: 18px;
    }

    @media (max-width: 520px) {
      form {
        flex-direction: column;
      }

      .add-btn {
        padding: 15px;
      }

      .todo-box {
        padding: 20px;
      }

      h1 {
        font-size: 36px;
      }

      .task {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="logo">✓</div>
      <h1>My Tasks</h1>
      <p>Plan your day. Make progress.</p>
    </header>

    <main class="todo-box">

      <form id="taskForm">
        <input
          type="text"
          id="taskInput"
          placeholder="What do you need to do?"
          maxlength="180"
          autocomplete="off"
        >
        <button type="submit" class="add-btn">+ Add</button>
      </form>

      <div class="stats">
        <span id="remaining">0 remaining</span>
        <span id="completedCount">0 completed</span>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <div id="taskList"></div>

      <div class="footer">
        <span id="total">0 total tasks</span>
        <button id="clearCompleted" class="clear-btn">
          Clear completed
        </button>
      </div>

    </main>

    <p class="tagline">
      Small steps every day lead to big results.
    </p>

  </div>

  <script>
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    let tasks = [];
    let currentFilter = "all";

    function renderTasks() {
      const completed = tasks.filter(task => task.done).length;
      const remaining = tasks.length - completed;

      document.getElementById("remaining").textContent =
        remaining + " remaining";

      document.getElementById("completedCount").textContent =
        completed + " completed";

      document.getElementById("total").textContent =
        tasks.length + (tasks.length === 1 ? " total task" : " total tasks");

      document.querySelectorAll(".filter-btn").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.filter === currentFilter
        );
      });

      taskList.replaceChildren();

      const visibleTasks = tasks.filter(task => {
        if (currentFilter === "active") return !task.done;
        if (currentFilter === "completed") return task.done;
        return true;
      });

      if (visibleTasks.length === 0) {
        const message = document.createElement("div");
        message.className = "empty";
        message.textContent = tasks.length === 0
          ? "Your task list is empty. Add your first task!"
          : "No tasks in this category.";
        taskList.appendChild(message);
      }

      visibleTasks.forEach(task => {
        const row = document.createElement("div");
        row.className = "task" + (task.done ? " completed" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Mark task completed");

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", "Delete task");

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          renderTasks();
        });

        row.append(checkbox, text, deleteButton);
        taskList.appendChild(row);
      });
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      tasks.unshift({
        id: Date.now() + Math.random(),
        text: text,
        done: false
      });

      input.value = "";
      renderTasks();
      input.focus();
    });

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        renderTasks();
      });
    });

    document.getElementById("clearCompleted").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.done);
      renderTasks();
    });

    renderTasks();
  </script>
</body>
</html>
